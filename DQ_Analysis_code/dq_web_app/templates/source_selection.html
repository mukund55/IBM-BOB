<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Data Source - Enterprise DQ Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #10b981 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.98) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .hero-section {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: fadeInDown 0.6s ease-out;
        }
        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.15);
            letter-spacing: -0.5px;
        }
        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.95;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .source-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            border: 3px solid transparent;
        }
        .source-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            border-color: #0ea5e9;
        }
        .source-card.selected {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.25) 100%);
        }
        .source-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .source-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
        }
        .source-description {
            color: #666;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .db-config-section {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .db-config-section.show {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-select, .form-control {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 12px 15px;
            font-size: 1rem;
        }
        .form-select:focus, .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 0.2rem rgba(14, 165, 233, 0.25);
        }
        .btn-proceed {
            background: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
            border: none;
            color: #000000;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 25px rgba(30, 64, 175, 0.5);
        }
        .btn-proceed:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(30, 64, 175, 0.7);
            background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 100%);
        }
        .btn-proceed:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading-spinner {
            display: none;
        }
        .loading-spinner.show {
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="fas fa-chart-line me-2"></i>Enterprise DQ Platform
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('auth.logout') }}">
                    <i class="fas fa-sign-out-alt me-1"></i>Back to Login
                </a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Hero Section -->
        <div class="hero-section">
            <h1 class="hero-title">Select Data Source</h1>
            <p class="hero-subtitle">Choose where your data is coming from</p>
        </div>

        <!-- Source Selection Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="source-card" id="flatfile-card" onclick="selectSource('flatfile')">
                    <div class="text-center">
                        <div class="source-icon">
                            <i class="fas fa-file-upload"></i>
                        </div>
                        <h3 class="source-title">Flat File</h3>
                        <p class="source-description">
                            Upload CSV, Excel, or DAT files for analysis
                        </p>
                        <div class="badge bg-primary">CSV • Excel • DAT</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="source-card" id="database-card" onclick="selectSource('database')">
                    <div class="text-center">
                        <div class="source-icon">
                            <i class="fas fa-database"></i>
                        </div>
                        <h3 class="source-title">Database</h3>
                        <p class="source-description">
                            Connect to Oracle database
                        </p>
                        <div class="badge bg-success">Oracle</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Proceed Button -->
        <div class="text-center mt-4">
            <button class="btn btn-proceed" id="proceed-btn" onclick="proceedToAnalysis()" disabled>
                <i class="fas fa-arrow-right me-2"></i>Proceed
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedSource = null;

        function selectSource(source) {
            selectedSource = source;
            
            // Update card selection
            document.getElementById('flatfile-card').classList.remove('selected');
            document.getElementById('database-card').classList.remove('selected');
            document.getElementById(source + '-card').classList.add('selected');
            
            // Enable proceed button
            const proceedBtn = document.getElementById('proceed-btn');
            proceedBtn.disabled = false;
        }

        function proceedToAnalysis() {
            if (!selectedSource) {
                alert('Please select a data source');
                return;
            }
            
            if (selectedSource === 'flatfile') {
                // Redirect to existing dashboard with file upload
                window.location.href = "{{ url_for('dashboard') }}";
            } else if (selectedSource === 'database') {
                // Redirect to database configuration page
                window.location.href = "{{ url_for('database_config') }}";
            }
        }
    </script>
</body>
</html>
